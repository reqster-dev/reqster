# Dependency updates. Minor and patch updates arrive as one grouped pull request per ecosystem;
# major updates come separately so they can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # Types must match the Node version the app ships with (.nvmrc), not the newest Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Packages that only work when they move together (a lone major bump of one of them cannot build)
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  # Actions are pinned to commit SHAs; Dependabot moves the pin and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
