name: claude

# Claude Code on GitHub: mention @claude in an issue (title or body) or in a comment on an issue or pull request,
# and Claude answers there; for code changes it pushes a claude/… branch and links a ready pull request.
# Only the maintainer can trigger it: this repository is public and anyone can open issues, so text from other
# people never starts a run (the action itself additionally requires write access). Claude reads the issue body
# as context, so review someone else's issue before mentioning @claude on it.
# Secret: CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`). Needs the Claude GitHub App on the repository.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.actor == 'talhacgdem' && (
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # to read CI results on pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Same toolchain as ci.yml so Claude can run typecheck/build on its changes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund

      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(npm run typecheck),Bash(npm run build),Bash(npm run build -w:*),Bash(git:*),Bash(node launcher/package.mjs:*),Bash(node launcher/smoke.mjs:*)"
            --append-system-prompt "Follow CLAUDE.md (Turkish: UI texts, messages, commit messages and comments in Turkish; identifiers in English). Sign off every commit with git commit -s (DCO check in ci.yml). Do not write issue numbers (#N) in commit messages; the pull request description may reference the issue. Run npm run typecheck before committing. Reply to the user in Turkish."
