name: release

# v1.2.3 tag → Linux tar.gz, Windows NSIS installer (+ the same installer zipped) + portable zip, macOS dmg (Apple Silicon + Intel) and the
# Tauri updater packages with signatures, published as a GitHub Release. Manual run → the same files as a
# workflow artifact, no release.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (minisign key of the updater; without it no .sig files are produced and
# installed apps will not accept the update). Builds are not code-signed yet (Windows SmartScreen / macOS
# Gatekeeper warn on first launch).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      app_version: ${{ steps.v.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # version: sidecar build info (tag version, or 0.0.0-dev.<sha7> for manual runs).
      # app_version: Tauri / NSIS version — NSIS needs x.y.z(-pre), so manual runs use package.json's version.
      - id: v
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            [[ "$v" == "$(node -p 'require("./package.json").version')" ]] || { echo "::error::tag $v != package.json version"; exit 1; }
            echo "version=$v" >> "$GITHUB_OUTPUT"; echo "app_version=$v" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
            echo "app_version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node launcher/package.mjs --target linux-x64 --version "${{ needs.meta.outputs.version }}"
      # The released tar.gz is the exact file that passed the smoke test.
      - run: node launcher/smoke.mjs dist/package/linux-x64/Reqster/reqster
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      APP_VERSION: ${{ needs.meta.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      # package.mjs runs `npm` without a shell, which does not resolve npm.cmd on Windows: build the frontend here.
      - run: npm run build -w @reqster/app
      - name: Sidecar (win-x64)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          node launcher/package.mjs --target win-x64 --version "${{ needs.meta.outputs.version }}" --sidecar-dir src-tauri --no-archive --skip-app-build
      - name: Tauri (NSIS installer)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          set -euo pipefail
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config "{\"version\":\"${APP_VERSION}\"}"
          exe="src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Reqster_${APP_VERSION}_x64-setup.exe"
          test -f "$exe" || { ls -la src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/ || true; exit 1; }
          mkdir -p dist && cp "$exe" dist/
          if [[ -f "$exe.sig" ]]; then cp "$exe.sig" dist/; else echo "::warning::no updater signature (.sig)"; fi
      - name: Portable zip
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          bash deploy/win-portable.sh "${APP_VERSION}" dist
      # Same installer inside a zip, for networks that block .exe downloads. Unlike the portable zip it installs
      # normally (WebView2 bootstrapper, Start menu, in-app updates). Only the .exe goes in; the .sig stays outside.
      - name: Installer zip
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          set -euo pipefail
          exe="Reqster_${APP_VERSION}_x64-setup.exe"
          zipf="Reqster_${APP_VERSION}_x64-setup.zip"
          test -f "dist/$exe"
          (cd dist && 7z a -tzip -bso0 -bsp0 "$zipf" "$exe")
          7z l "dist/$zipf" | grep -F "$exe"
      # Ham log'lar yalnızca oturum açmış kullanıcıya açık; düşen adımın son satırlarını herkese açık hata notu yap
      - name: Failure summary
        if: failure()
        run: |
          f="$RUNNER_TEMP/ci.log"; [[ -f "$f" ]] || exit 0
          msg=$(tail -n 60 "$f" | sed -e 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          echo "::error title=last log lines::${msg}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.sig
            dist/*.zip
          if-no-files-found: error

  macos:
    needs: meta
    runs-on: macos-latest   # Apple Silicon; the Intel build is cross-compiled
    timeout-minutes: 90
    env:
      APP_VERSION: ${{ needs.meta.outputs.app_version }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @reqster/app

      - name: Sidecar (darwin-arm64)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          node launcher/package.mjs --target darwin-arm64 --version "$VERSION" --sidecar-dir src-tauri --no-archive --skip-app-build
      - name: Tauri (aarch64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          set -euo pipefail
          # the updater package (Reqster.app.tar.gz) is only produced for the `app` bundle → --bundles app,dmg
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config "{\"version\":\"${APP_VERSION}\"}"
          mkdir -p dist
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg dist/
          up=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Reqster.app.tar.gz
          if [[ -f "$up.sig" ]]; then
            cp "$up" "dist/Reqster_${APP_VERSION}_aarch64.app.tar.gz"; cp "$up.sig" "dist/Reqster_${APP_VERSION}_aarch64.app.tar.gz.sig"
          else echo "::warning::no updater package (aarch64)"; fi

      # isolated-vm ships no darwin-x64 prebuild: build it here for x64 and put it where package.mjs looks for it.
      - name: isolated-vm (x64)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          set -euo pipefail
          abi=$(node -p 'process.versions.modules')
          ( cd node_modules/isolated-vm && npx node-gyp rebuild --release --arch=x64 -j max )
          mkdir -p node_modules/isolated-vm/prebuilds/darwin-x64
          cp "$(ls node_modules/isolated-vm/build/Release/isolated*vm.node | head -1)" "node_modules/isolated-vm/prebuilds/darwin-x64/isolated-vm.abi${abi}.node"
          rm -rf node_modules/isolated-vm/build
          file node_modules/isolated-vm/prebuilds/darwin-x64/*.node
      - name: Sidecar (darwin-x64)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          node launcher/package.mjs --target darwin-x64 --version "$VERSION" --sidecar-dir src-tauri --no-archive --skip-app-build
      - name: Tauri (x64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          set -euo pipefail
          npx tauri build --target x86_64-apple-darwin --bundles app,dmg --config "{\"version\":\"${APP_VERSION}\"}"
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg dist/
          up=src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Reqster.app.tar.gz
          if [[ -f "$up.sig" ]]; then
            cp "$up" "dist/Reqster_${APP_VERSION}_x64.app.tar.gz"; cp "$up.sig" "dist/Reqster_${APP_VERSION}_x64.app.tar.gz.sig"
          else echo "::warning::no updater package (x64)"; fi
          ls -la dist/
      # Ham log'lar yalnızca oturum açmış kullanıcıya açık; düşen adımın son satırlarını herkese açık hata notu yap
      - name: Failure summary
        if: failure()
        run: |
          f="$RUNNER_TEMP/ci.log"; [[ -f "$f" ]] || exit 0
          msg=$(tail -n 60 "$f" | sed -e 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          echo "::error title=last log lines::${msg}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.sig
          if-no-files-found: error

  release:
    needs: [meta, linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.meta.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        run: |
          set -euo pipefail
          ls -la dist
          cat > notes.md <<EOF
          | Platform | File |
          |---|---|
          | Windows | \`Reqster_${V}_x64-setup.exe\` (installer) · \`Reqster_${V}_x64-setup.zip\` (the same installer in a zip, if your network blocks .exe) · \`Reqster_${V}_x64-portable.zip\` (no installation, run \`Reqster\\reqster.exe\`) |
          | macOS | \`Reqster_${V}_aarch64.dmg\` (Apple Silicon) · \`Reqster_${V}_x64.dmg\` (Intel) |
          | Linux | \`Reqster-${V}-linux-x64.tar.gz\` (server, open http://127.0.0.1:7357) |

          Builds are not code-signed yet: Windows SmartScreen may warn (More info → Run anyway); on macOS use
          System Settings → Privacy & Security → Open Anyway on first launch. \`*.sig\` and \`*.app.tar.gz\` files are
          used by the in-app updater.
          EOF
          # "What's new" comes first, taken from CHANGELOG.md / CHANGELOG.tr.md (deploy/changelog.sh). The Turkish
          # part sits between markers; the download site copies it into the updater manifest and the app shows
          # it in the update dialog.
          deploy/changelog.sh notes "$V" > changes.md
          cat changes.md notes.md > body.md && mv body.md notes.md
          # Mandatory update (deploy/surum.sh --zorunlu writes this trailer into the version commit): the marker
          # below makes the download site put this version as `minimumVersion` into the updater manifest, so
          # older desktop installs must update before they open. Adding the marker to an existing Release later
          # has the same effect once the site republishes.
          if gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message | grep -qx 'Zorunlu-Guncelleme: evet'; then
            printf '\n**Mandatory update:** desktop installs older than %s must install it before the app opens.\n\n<!-- reqster:minimum-version -->\n' "$V" >> notes.md
            echo "mandatory update: marker added to the release notes"
          fi
          pre=(); [[ "$V" == *-* ]] && pre=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --title "Reqster $V" --notes-file notes.md "${pre[@]}"
          fi
