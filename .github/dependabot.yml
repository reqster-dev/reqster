# Dependency updates. Minor and patch updates arrive as one grouped pull request per ecosystem;
# major updates come separately so they can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  # Actions are pinned to commit SHAs; Dependabot moves the pin and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
